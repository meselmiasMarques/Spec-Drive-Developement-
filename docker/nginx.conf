server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API no mesmo domínio do frontend (sem CORS).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O service worker e o index devem sempre ser revalidados para o PWA atualizar.
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Rotas do Blazor são resolvidas no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
